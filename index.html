html,body{margin:0;background:var(--bg)}

.wrap{max-width:1180px;margin:0 auto;padding:18px}
.raise{background:var(--bg);border-radius:24px;box-shadow:9px 9px 20px var(--sd),-9px -9px 20px var(--hl)}
.top{position:sticky;top:10px;z-index:10;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;margin-bottom:20px}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}

.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}

.pbar{height:10px;border-radius:10px;margin-top:18px;box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--hl);overflow:hidden}

.skh{display:flex;align-items:center;gap:12px;padding:6px 0}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

['تیک آبی بخرم','قسمت تکالیف زبان رو به پلنر اضافه کنم','باید صداهایی که به صدای بوئت میخورن رو پیدا کنم','پسوردامو مرتب یکجا بکاپ بگیرم','ببینم اون وست بافت رو با چی ست کنم','با کامفی یو ای ویدیو بسازم','صدای سمپل رو از الون لبز بگیرم','دوره پایتون رو تا جایی که پخش شده ببینم','کار جدیدمو تعیین کنم','اون برنامه جدید رو داخل کامفی یو آی نصب کنم'].forEach(function(t,i){S.tasks.push({id:i+1,t:t,cat:'کار',when:'week',date:iso(TODAY),done:false})})}

var LANGH='مطالعه زبان',BS=['خوانده‌ام','در حال خواندن','می‌خوام بخونم'],MS=['در حال دیدن','دیده‌ام','می‌خوام ببینم'],OFF=[1,3,7,14];
function peek(k){return S.days[typeof k=='string'?k:iso(k)]}

function H(x){return fa(Math.round(x*10)/10)}
function ring(p,sz,lab){p=Math.max(0,Math.min(1,p||0));sz=sz||36;var c=sz/2,r=c-3.5,C=2*Math.PI*r;return '<svg width="'+sz+'" height="'+sz+'" viewBox="0 0 '+sz+' '+sz+'" role="img" aria-label="'+Math.round(p*100)+'%"><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#ddcacd" stroke-width="4"/><circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="#541521" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(C*p)+' '+C+'" transform="rotate(-90 '+c+' '+c+')" style="transition:stroke-dasharray .5s"/><text x="'+c+'" y="'+(c+3.8)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="#541521" font-family="Vazirmatn,sans-serif">'+(lab!=null?lab:fa(Math.round(p*100)))+'</text></svg>'}
function dayN(d){return diffD(d,fromIso(S.prStart))+1}

function curTasks(){var k=iso(cur),ws=iso(wStart(cur)),now=diffD(cur,TODAY)==0;return{td:S.tasks.filter(function(t){return t.when=='today'&&(t.date==k||(now&&overdue(t)))}),wk:S.tasks.filter(function(t){return t.when=='week'&&(iso(wStart(fromIso(t.date)))==ws||(now&&overdue(t)))})}}
function rTop(){var j=jOf(cur);$('dDay').textContent=WDN[cur.getDay()]+' '+fa(j[2])+' '+MN[j[1]-1]+' '+fa(j[0]);var ws=wStart(cur),h='';for(var i=0;i<7;i++){var d=addD(ws,i);h+='<button class="sd'+(diffD(d,cur)==0?' on':'')+'" data-a="go" data-k="'+iso(d)+'"><span>'+WS[d.getDay()]+(diffD(d,TODAY)==0?' •':'')+'</span>'+ring(pct(d),34,fa(jOf(d)[2]))+'</button>'}$('strip').innerHTML=h}
function rAlerts(){var a=[],od=S.tasks.filter(overdue).length;if(od)a.push(fa(od)+' کار عقب‌افتاده');var y1=peek(addD(TODAY,-1)),y2=peek(addD(TODAY,-2));if((!y1||!(y1.lang>=2))&&(!y2||!(y2.lang>=2)))a.push('دو روزه زیر ۲ ساعت زبان');var ws=wStart(TODAY),g=0,c=0,need=0;for(var i=0;i<7;i++){var dd=addD(ws,i),p=peek(dd);if(p&&p.gym)g++;if(p&&p.cls)c++;if((dd.getDay()==1||dd.getDay()==3)&&diffD(TODAY,dd)>0)need++}var left=7-diffD(TODAY,ws);if(g<3&&g+left<3)a.push('به ۳ جلسه باشگاه نمی‌رسی');if(need>c)a.push('کلاس زبان جبرانی می‌خواد');$('alerts').innerHTML=a.map(function(x){return '<span>• '+x+'</span>'}).join('')}
function streak(n){var c=0,d=hOn(peek(cur),n)?cur:addD(cur,-1);while(hOn(peek(d),n)&&c<400){c++;d=addD(d,-1)}return c}
function rHabits(){$('hMode').innerHTML='<button class="btn'+(S.hm=='week'?' on':'')+'" data-a="hm" data-v="week">هفته</button><button class="btn'+(S.hm=='month'?' on':'')+'" data-a="hm" data-v="month">ماه</button>';var h='<table class="hab">',ws=wStart(cur);

else{var j=jOf(cur),ms=dOfJ(j[0],j[1],1),pass=diffD(cur,ms)+1;S.habits.forEach(function(c){h+='<tr class="cat"><td colspan="3">'+esc(c.c)+'</td></tr>';c.i.forEach(function(n){var cnt=0;for(var i=0;i<pass;i++)if(hOn(peek(addD(ms,i)),n))cnt++;h+='<tr><td class="n">'+esc(n)+'</td><td style="width:44px">'+ring(cnt/pass,30,fa(cnt))+'</td></tr>'})})}

function rTimer(){var s=Math.floor(tSec()),f=function(x){return String(x).padStart(2,'0')};$('tmShow').textContent=fa(f(Math.floor(s/3600))+':'+f(Math.floor(s%3600/60))+':'+f(s%60));var b=$('tPlay');b.textContent=S.run?'❚❚':'▶';b.className='play'+(S.run?' on':'')}
