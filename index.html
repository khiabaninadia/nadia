:root{--bg:#efe3e5;--sd:#d6c2c5;--hl:#ffffff;--bu:#541521;--rose:#c98892;--ink:#3b2026;--mu:#9a8085}

html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.raise{background:var(--bg);border-radius:24px;box-shadow:9px 9px 20px var(--sd),-9px -9px 20px var(--hl)}
.top{position:sticky;top:10px;z-index:10;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px;margin-bottom:20px}
.dt{font-weight:700;color:var(--bu);font-size:16px;min-width:210px;text-align:center}
.nb{width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--hl);color:var(--bu);font-size:18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.nb:active{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--hl)}
.tb{border:0;border-radius:999px;padding:8px 18px;background:var(--bg);box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--hl);color:var(--bu);font-weight:700;cursor:pointer;font-size:13px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}
.sd{border:0;background:var(--bg);border-radius:18px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mu);font-size:12px;box-shadow:4px 4px 10px var(--sd),-4px -4px 10px var(--hl);transition:box-shadow .25s}
.sd.on{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--hl);color:var(--bu);font-weight:700}
.alerts{display:flex;flex-wrap:wrap;gap:4px 18px;justify-content:center;margin:0 0 18px;font-size:12px;color:var(--mu)}
.alerts:empty{display:none}
.mas{display:flex;gap:22px;align-items:stretch}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}

.card{padding:20px 20px 16px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}

.meta{color:var(--mu);font-size:12px}
.hr{display:flex;align-items:center;gap:10px}

select{-webkit-appearance:none;appearance:none;cursor:pointer;padding:6px 12px;font-size:12px}
.btn{border:0;border-radius:999px;padding:7px 14px;background:var(--bg);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--hl);color:var(--bu);font-weight:600;cursor:pointer;font-size:12.5px;transition:box-shadow .2s}
.btn.on{box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--hl);font-weight:800}
.btn.pri{background:var(--bu);color:#fff}

.addrow{display:flex;gap:8px;margin-bottom:12px}.addrow input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.li{display:flex;align-items:center;gap:10px;padding:6px 2px;transition:opacity .45s,transform .45s}
.li .t{flex:1;padding:0 4px}

.li.go{opacity:0;transform:translateY(22px)}
.ck{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:8px;border:0;background:var(--bg);box-shadow:3px 3px 6px var(--sd),-3px -3px 6px var(--hl);cursor:pointer;flex:none;display:inline-grid;place-content:center;margin:0}

.tm{font-size:28px;font-weight:700;color:var(--bu)}
.play{width:54px;height:54px;border-radius:50%;border:0;background:var(--bg);box-shadow:5px 5px 12px var(--sd),-5px -5px 12px var(--hl);color:var(--bu);font-size:16px;cursor:pointer}

.bars{display:flex;gap:3px;align-items:flex-end;height:40px;margin:16px 0 4px}
.bars i{flex:1;border-radius:3px;background:var(--sd);min-height:3px}.bars i.ok{background:var(--bu)}.bars i.mid{background:var(--rose)}
.kp,.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.st{grid-template-columns:repeat(4,1fr)}
.kp div,.st div{border-radius:16px;padding:8px 4px;text-align:center;font-size:11px;color:var(--mu);box-shadow:inset 3px 3px 7px var(--sd),inset -3px -3px 7px var(--hl)}
.kp b,.st b{display:block;font-size:15px;color:var(--bu)}
.les{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:10px}
.lc{aspect-ratio:1;border:0;border-radius:50%;background:var(--bg);box-shadow:3px 3px 7px var(--sd),-3px -3px 7px var(--hl);color:var(--bu);font-size:12px;cursor:pointer;transition:all .5s}

.lc.cur{outline:2px solid var(--rose);outline-offset:2px}
.pbar{height:10px;border-radius:10px;margin-top:18px;box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--hl);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:10px;background:linear-gradient(270deg,var(--rose),var(--bu));transition:width .6s,opacity .6s}
.trend{width:100%;height:50px;margin-top:12px;display:block;transition:opacity .6s}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}
.cal .h{font-size:11px;color:var(--mu)}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;position:relative}
.cal .d.sel{box-shadow:inset 2px 2px 5px var(--sd),inset -2px -2px 5px var(--hl);font-weight:800;color:var(--bu)}
.cal .d.today{font-weight:800;color:var(--bu)}
.cal .d.g::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--rose)}
.l1{background:rgba(201,136,146,.15)}.l2{background:rgba(201,136,146,.35)}.l3{background:rgba(201,136,146,.65)}.cal .d.l4{background:var(--bu);color:#fff}

details summary{cursor:pointer;list-style:none;color:var(--mu);font-size:12.5px;margin-top:14px}details summary::-webkit-details-marker{display:none}
.skh{display:flex;align-items:center;gap:12px;padding:6px 0}

var st;
var hoursEl=document.getElementById('hours');
for(var h=6;h<=23;h++){var d=document.createElement('div');d.className='hour';d.innerHTML='<span>'+fa((h<10?'0':'')+h)+':۰۰</span><input type="text" data-h="'+h+'" placeholder="...">';hoursEl.appendChild(d)}
hoursEl.addEventListener('input',function(e){if(e.target.dataset.h){st.hours[e.target.dataset.h]=e.target.value;save()}});
document.querySelectorAll('[data-k]').forEach(function(el){el.addEventListener('input',function(){st[el.dataset.k]=el.value;save()})});
var moods=['😄','🙂','😐','😔','😫'];var mEl=document.getElementById('moods');
moods.forEach(function(m){var b=document.createElement('button');b.textContent=m;b.onclick=function(){st.mood=st.mood===m?'':m;save();render()};mEl.appendChild(b)});
var wEl=document.getElementById('water');
for(var i=1;i<=8;i++){(function(i){var b=document.createElement('button');b.title=fa(i)+' لیوان';b.onclick=function(){st.water=st.water===i?i-1:i;save();render()};wEl.appendChild(b)})(i)}
function addTask(){var inp=document.getElementById('newTask');var t=inp.value.trim();if(!t)return;st.tasks.push({t:t,d:false});inp.value='';save();render()}
document.getElementById('addBtn').onclick=addTask;
document.getElementById('newTask').addEventListener('keydown',function(e){if(e.key==='Enter')addTask()});
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function render(){
document.getElementById('dateLabel').textContent=new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(cur);
document.querySelectorAll('[data-k]').forEach(function(el){el.value=st[el.dataset.k]||''});
hoursEl.querySelectorAll('input').forEach(function(el){el.value=st.hours[el.dataset.h]||''});
var tEl=document.getElementById('tasks');tEl.innerHTML='';
if(!st.tasks.length)tEl.innerHTML='<div class="empty">هنوز کاری اضافه نکرده‌ای.</div>';
st.tasks.forEach(function(t,i){var r=document.createElement('div');r.className='task'+(t.d?' done':'');r.innerHTML='<input type="checkbox" id="t'+i+'"'+(t.d?' checked':'')+'><label for="t'+i+'">'+esc(t.t)+'</label><button class="del" title="حذف">✕</button>';r.querySelector('input').onchange=function(){t.d=!t.d;save();render()};r.querySelector('.del').onclick=function(){st.tasks.splice(i,1);save();render()};tEl.appendChild(r)});
var done=st.tasks.filter(function(t){return t.d}).length,tot=st.tasks.length;
document.getElementById('prog').textContent=tot?fa(done)+' از '+fa(tot)+' کار انجام شد':'';
document.getElementById('barFill').style.width=(tot?Math.round(done/tot*100):0)+'%';
wEl.querySelectorAll('button').forEach(function(b,i){b.className=i<st.water?'on':''});
document.getElementById('waterTxt').textContent=fa(st.water)+' از ۸ لیوان';
mEl.querySelectorAll('button').forEach(function(b){b.className=b.textContent===st.mood?'on':''});
}
function go(n){cur.setDate(cur.getDate()+n);st=load();render()}
document.getElementById('prev').onclick=function(){go(-1)};
document.getElementById('next').onclick=function(){go(1)};
document.getElementById('today').onclick=function(){cur=new Date();cur.setHours(0,0,0,0);st=load();render()};
st=load();render();
})();
</script>
</body>
</html>
